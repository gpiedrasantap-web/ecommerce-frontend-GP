# Frontend SonarQube Configuration
sonar.projectKey=ecommerce-frontend-GP
sonar.projectName=ecommerce-frontend-GP
sonar.projectVersion=1.0

# Source files
sonar.sources=src
sonar.tests=src
sonar.sourceEncoding=UTF-8
sonar.language=js

# Test coverage
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.testExecutionReportPaths=test-report.xml

# Exclusions
sonar.coverage.exclusions=**/*.test.js,coverage/**,node_modules/**

# Quality Gate
sonar.qualitygate.wait=true